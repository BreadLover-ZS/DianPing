server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    # 【安全修复 Fix 1-2】使用环境变量管理数据库连接信息，避免敏感凭证硬编码和公网暴露
    # 生产环境通过环境变量或配置中心（如 Nacos）注入，默认值仅用于本地开发
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/hmdp?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    # 【安全修复 Fix 1-2】Redis 连接信息使用环境变量，避免公网暴露和密码硬编码
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    # 【安全修复】生产环境使用 info 级别，避免 debug 日志泄露敏感信息
    com.hmdp: info