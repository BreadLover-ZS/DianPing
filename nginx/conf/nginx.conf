
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    
    keepalive_timeout  65;

    # 【安全修复】Fix 16: 添加安全响应头
    # X-Frame-Options: 防止点击劫持
    # X-Content-Type-Options: 防止 MIME 类型嗅探
    # X-XSS-Protection: 启用浏览器 XSS 过滤器
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================================
    # 【安全修复】Fix 16: HTTP -> HTTPS 重定向
    # 生产环境应启用 HTTPS，将所有 HTTP 请求重定向到 HTTPS
    # 
    # 使用前需要：
    # 1. 申请 SSL 证书（可使用 Let's Encrypt 免费证书）
    # 2. 将证书文件放置到 conf/ssl/ 目录下
    # 3. 取消下方 HTTPS server 块的注释
    # ============================================================

    server {
        listen       8080;
        server_name  localhost;

        # 【安全修复】生产环境启用 HTTPS 重定向
        # return 301 https://$host:8443$request_uri;

        # 指定前端项目所在的位置
        location / {
            root   html/dishreview;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        location /api {  
            default_type  application/json;
            keepalive_timeout   30s;  
            keepalive_requests  1000;  
            proxy_http_version  1.1;  
            rewrite /api(/.*) $1 break;  
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;  
            proxy_pass http://127.0.0.1:8081;
        }
    }

    # ============================================================
    # 【安全修复】Fix 16: HTTPS 服务配置
    # 生产环境取消注释并配置 SSL 证书
    # ============================================================
    # server {
    #     listen       8443 ssl;
    #     server_name  localhost;
    #     
    #     # SSL 证书配置
    #     ssl_certificate      conf/ssl/server.crt;
    #     ssl_certificate_key  conf/ssl/server.key;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     ssl_ciphers          HIGH:!aNULL:!MD5;
    #     ssl_session_cache    shared:SSL:1m;
    #     ssl_session_timeout  5m;
    #     
    #     # 安全响应头
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     
    #     location / {
    #         root   html/dishreview;
    #         index  index.html index.htm;
    #     }
    #     
    #     error_page   500 502 503 504  /50x.html;
    #     location = /50x.html {
    #         root   html;
    #     }
    #     
    #     location /api {  
    #         default_type  application/json;
    #         keepalive_timeout   30s;  
    #         keepalive_requests  1000;  
    #         proxy_http_version  1.1;  
    #         rewrite /api(/.*) $1 break;  
    #         proxy_pass_request_headers on;
    #         proxy_next_upstream error timeout;  
    #         proxy_pass http://127.0.0.1:8081;
    #     }
    # }

    upstream backend {
        server 127.0.0.1:8081 max_fails=5 fail_timeout=10s weight=1;
        #server 127.0.0.1:8082 max_fails=5 fail_timeout=10s weight=1;
    }  
}
